<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nautix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:  #0B1426;
      --cyan:  #00B4D8;
      --text-1:#E8F4FD;
      --text-2:#7A9EBC;
      --text-3:#3D5A73;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background:var(--navy); color:var(--text-1);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh; min-height:100dvh;
    }

    /* Loading */
    #loading {
      position:fixed; inset:0; background:var(--navy);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:20px; z-index:200;
    }
    .spinner {
      width:44px; height:44px;
      border:3px solid rgba(0,180,216,.15);
      border-top-color:var(--cyan);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #loading-text {
      font-family:'Barlow Condensed',sans-serif;
      font-size:14px; letter-spacing:3px;
      color:var(--text-2);
    }

    /* Login */
    #screen-login {
      min-height:100vh; min-height:100dvh;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      padding:48px 24px 32px;
      position:relative; overflow:hidden;
    }
    #screen-login.visible { display:flex; }

    #screen-login::before {
      content:''; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(0,180,216,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,216,.04) 1px, transparent 1px);
      background-size:44px 44px; pointer-events:none;
    }
    #screen-login::after {
      content:''; position:absolute;
      top:30%; left:50%; transform:translate(-50%,-50%);
      width:320px; height:320px;
      background:radial-gradient(circle, rgba(0,180,216,.08) 0%, transparent 70%);
      pointer-events:none;
    }

    .login-logo {
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800; font-size:80px;
      letter-spacing:10px; color:var(--text-1);
      line-height:1; position:relative; z-index:1;
    }
    .login-logo .accent { color:var(--cyan); }

    .login-rule {
      width:260px; height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
      margin:18px 0 14px; position:relative; z-index:1;
    }

    .login-tagline {
      font-family:'Barlow Condensed',sans-serif;
      font-weight:400; font-size:15px;
      letter-spacing:4px; color:var(--text-2);
      text-align:center; margin-bottom:72px;
      position:relative; z-index:1;
    }

    .btn-google {
      display:flex; align-items:center; gap:14px;
      background:var(--text-1); color:#1a1a1a;
      border:none; border-radius:4px;
      padding:17px 32px;
      font-family:'Inter',sans-serif;
      font-size:16px; font-weight:600;
      cursor:pointer; width:100%; max-width:300px;
      justify-content:center;
      position:relative; z-index:1;
      transition:transform .1s;
    }
    .btn-google:active { transform:scale(.97); }
    .btn-google:disabled { opacity:.6; cursor:not-allowed; }
    .btn-google svg { width:22px; height:22px; flex-shrink:0; }

    .status-msg {
      margin-top:16px; font-size:13px;
      text-align:center; position:relative; z-index:1;
      color:var(--text-2); min-height:20px;
    }
    .status-msg.error { color:#EF233C; }

    .login-footer {
      position:absolute; bottom:28px;
      font-size:12px; color:var(--text-3);
      text-align:center; line-height:1.7; z-index:1;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">LOADING</div>
</div>

<div id="screen-login">
  <div class="login-logo">NAUT<span class="accent">I</span>X</div>
  <div class="login-rule"></div>
  <div class="login-tagline">KNOW THE SEA. KNOW THE CODE.</div>

  <button class="btn-google" id="btn-signin" onclick="signIn()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </button>
  <div class="status-msg" id="status-msg"></div>

  <div class="login-footer">
    For deck officers, engineers &amp; ETOs worldwide<br>
    Based on IMO conventions &amp; USCG standards
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyCMxTMv0yWJHjbYndJpGiYnF6y9W19mpC0",
    authDomain:        "nautix-3d62c.firebaseapp.com",
    projectId:         "nautix-3d62c",
    storageBucket:     "nautix-3d62c.firebasestorage.app",
    messagingSenderId: "139539390330",
    appId:             "1:139539390330:web:1239b101edb0a4ab4d40c3"
  };

  firebase.initializeApp(firebaseConfig);
  const auth     = firebase.auth();
  const db       = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  const loadingEl = document.getElementById('loading');
  const loadingTxt = document.getElementById('loading-text');
  const loginEl  = document.getElementById('screen-login');
  const statusEl = document.getElementById('status-msg');
  const btnEl    = document.getElementById('btn-signin');

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className   = 'status-msg' + (isError ? ' error' : '');
  }

  async function goToHome(user) {
    loadingTxt.textContent = 'SIGNING IN...';
    try {
      await db.collection('users').doc(user.uid).set({
        uid:         user.uid,
        displayName: user.displayName,
        email:       user.email,
        photoURL:    user.photoURL,
        lastSeen:    firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(e) { console.warn('syncUser:', e); }
    window.location.replace('home.html');
  }

  // 1. Önce redirect sonucunu kontrol et
  loadingTxt.textContent = 'CHECKING AUTH...';
  auth.getRedirectResult().then(async (result) => {
    if (result && result.user) {
      await goToHome(result.user);
      return;
    }
    // 2. Mevcut oturumu kontrol et
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        await goToHome(user);
      } else {
        loadingEl.style.display = 'none';
        loginEl.classList.add('visible');
      }
    });
  }).catch((err) => {
    console.error('Redirect error:', err);
    loadingEl.style.display = 'none';
    loginEl.classList.add('visible');
    setStatus('Auth error: ' + err.code, true);
  });

  // Sign in butonu
  function signIn() {
    btnEl.disabled = true;
    setStatus('Redirecting to Google...');
    auth.signInWithRedirect(provider);
  }
</script>
</body>
</html>
